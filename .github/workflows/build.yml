name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest] # only linux for now

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # - name: Install Linux dependencies
      #   if: matrix.os == 'ubuntu-latest'
      #   run: |
      #     sudo apt update
      #     sudo apt install -y \
      #       build-essential \
      #       pkg-config \
      #       libgtk-3-dev \
      #       libwebkit2gtk-4.1-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir release
          mv bin/read-it release/read-it
          zip -j read-it.zip release/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: read-it
          path: "*.zip"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Show files
        run: ls -R

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.zip
